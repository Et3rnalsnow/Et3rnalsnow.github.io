function Navbar({ activeSection, onNavigate }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    const handleScroll = () => {
      setScrolled(window.scrollY > 20);
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  const handleClick = (e, id) => {
    e.preventDefault();
    setMenuOpen(false);
    onNavigate(id);
  };

  return (
    <>
      <nav className={`nav ${scrolled ? 'scrolled' : ''}`}>
        <div className="nav-inner">
          <a href="#top" className="nav-brand" onClick={(e) => handleClick(e, 'top')}>
            <div className="nav-brand-mark">文</div>
            <div className="nav-brand-text">
              <span className="nav-brand-name">文雪怡</span>
              <span className="nav-brand-sub">Portfolio</span>
            </div>
          </a>

          <ul className={`nav-links ${menuOpen ? 'open' : ''}`}>
            {CATEGORIES.map((cat) => (
              <li key={cat.id}>
                <a
                  href={`#${cat.id}`}
                  className={`nav-link ${activeSection === cat.id ? 'active' : ''}`}
                  onClick={(e) => handleClick(e, cat.id)}
                >
                  {cat.name}
                </a>
              </li>
            ))}
            <li>
              <a
                href="#contact"
                className={`nav-link ${activeSection === 'contact' ? 'active' : ''}`}
                onClick={(e) => handleClick(e, 'contact')}
              >
                联系方式
              </a>
            </li>
          </ul>

          <button
            className="nav-hamburger"
            onClick={() => setMenuOpen(!menuOpen)}
            aria-label="菜单"
          >
            {menuOpen ? <Icons.Close /> : <Icons.Menu />}
          </button>
        </div>
      </nav>
      <div
        className={`mobile-menu-backdrop ${menuOpen ? 'open' : ''}`}
        onClick={() => setMenuOpen(false)}
      />
    </>
  );
}

/* ============================================================
   视频作品卡片
   ============================================================ */
function VideoCard({ work, onPlay }) {
  const videoRef = useRef(null);
  const [hovered, setHovered] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [videoReady, setVideoReady] = useState(false);
  const [videoError, setVideoError] = useState(false);

  useEffect(() => {
    if (hovered && !loaded && videoRef.current) {
      videoRef.current.src = work.src;
      videoRef.current.load();
      setLoaded(true);
    }
  }, [hovered, loaded, work.src]);

  useEffect(() => {
    if (videoRef.current && loaded && videoReady) {
      if (hovered) {
        videoRef.current.play().catch(() => {});
      } else {
        videoRef.current.pause();
        videoRef.current.currentTime = 0;
      }
    }
  }, [hovered, loaded, videoReady]);

  const handleMouseEnter = () => {
    setHovered(true);
  };

  const handleMouseLeave = () => {
    setHovered(false);
  };

  return (
    <article
      className="work-card reveal"
      onMouseEnter={handleMouseEnter}
      onMouseLeave={handleMouseLeave}
      onClick={() => onPlay(work)}
    >
      <div className="work-card-media">
        <video
          ref={videoRef}
          muted
          playsInline
          preload="none"
          poster=""
          onLoadedData={() => setVideoReady(true)}
          onError={() => setVideoError(true)}
        />
        {!videoReady && (
          <div className="work-card-fallback">
            <div className="work-fallback-icon">
              <Icons.Video />
            </div>
            <span className="work-fallback-text">点击播放视频</span>
          </div>
        )}
        <span className="work-card-badge">视频作品</span>
        <div className="work-card-overlay">
          <div className="work-play-btn">
            <Icons.Play />
          </div>
        </div>
      </div>
      <div className="work-card-body">
        <h3 className="work-card-title">{work.title}</h3>
        <p className="work-card-desc">{work.desc}</p>
        <div className="work-card-meta">
          <span className="work-meta-item">
            <Icons.Clock />
            {work.duration}
          </span>
          <span className="work-meta-item">
            <Icons.Video />
            点击播放
          </span>
        </div>
      </div>
    </article>
  );
}

            <VideoCard work={w} onPlay={onPlayVideo} />

        ))}

  return (

        <div className="section-title-group">
          <span className="section-eyebrow">Section {num}</span>
          <h2 className="section-title">{name}</h2>

      </div>

    </section>
  );
}

/* ============================================================
   视频弹窗
   ============================================================ */
function VideoModal({ work, onClose }) {
  const videoRef = useRef(null);

  useEffect(() => {
    if (work && videoRef.current) {
      videoRef.current.play().catch(() => {});
    }
  }, [work]);

  useEffect(() => {
    const handleKey = (e) => {
      if (e.key === 'Escape') onClose();
    };
    if (work) {
      document.body.style.overflow = 'hidden';
      window.addEventListener('keydown', handleKey);
    }
    return () => {
      document.body.style.overflow = '';
      window.removeEventListener('keydown', handleKey);
    };
  }, [work, onClose]);

  if (!work) return null;

  return (
    <div className={`video-modal-backdrop ${work ? 'open' : ''}`} onClick={onClose}>
      <div className="video-modal" onClick={(e) => e.stopPropagation()}>
        <div className="video-modal-header">
          <span className="video-modal-title">{work.title}</span>
          <button className="video-modal-close" onClick={onClose} aria-label="关闭">
            <Icons.Close />
          </button>
        </div>
        <div className="video-modal-player">
          <video
            ref={videoRef}
            src={work.src}
            controls
            playsInline
            autoPlay
          >
            您的浏览器不支持视频播放
          </video>
        </div>
      </div>
    </div>
  );
}

        <div className="footer-bottom">
          <p className="footer-copyright">
            © {new Date().getFullYear()} 文雪怡 · 保留所有权利
          </p>
          <p className="footer-tags-line">
            视频剪辑 · 平面设计 · 音频创作 · AI 影像
          </p>
        </div>
      </div>
    </footer>
  );
}

/* ============================================================
   主应用
   ============================================================ */
function App() {
  const [activeSection, setActiveSection] = useState('top');
  const [playingVideo, setPlayingVideo] = useState(null);

  // 滚动联动导航高亮
  useEffect(() => {
    const sectionIds = ['top', ...CATEGORIES.map((c) => c.id), 'contact'];

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && entry.intersectionRatio > 0.3) {
            setActiveSection(entry.target.id);
          }
        });
      },
      { threshold: [0.3, 0.5, 0.7], rootMargin: '-100px 0px -40% 0px' }
    );

    sectionIds.forEach((id) => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });

    return () => observer.disconnect();
  }, []);

  // 滚动揭示动画
  useEffect(() => {
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
    );

    reveals.forEach((el) => observer.observe(el));
    return () => observer.disconnect();
  }, []);

  const handleNavigate = useCallback((id) => {
    const el = document.getElementById(id);
    if (el) {
      const navHeight = 72;
      const top = el.getBoundingClientRect().top + window.scrollY - navHeight + 1;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }, []);

  const handlePlayVideo = useCallback((work) => {
    setPlayingVideo(work);
  }, []);

  const handleCloseVideo = useCallback(() => {
    setPlayingVideo(null);
  }, []);

  return (
    <>
      <Navbar activeSection={activeSection} onNavigate={handleNavigate} />
      <main>
        <Hero />
        {CATEGORIES.map((cat, idx) => (
          <React.Fragment key={cat.id}>
            <WorksSection
              category={cat}
              works={WORKS[cat.id]}
              index={idx}
              onPlayVideo={handlePlayVideo}
            />
            {idx < CATEGORIES.length - 1 && <div className="section-divider" />}
          </React.Fragment>
        ))}
      </main>
      <Footer />
      <VideoModal work={playingVideo} onClose={handleCloseVideo} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
